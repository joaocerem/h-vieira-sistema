spring:
  application:
    name: hvieira-financeiro

  datasource:
    url: jdbc:postgresql://localhost:5432/hvieira_financeiro
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

hvieira:
  conciliacao:
    # T6 (docs/pendencias.md) — tolerância de dias no matching automático de conciliação. Parâmetro
    # operacional configurável, nunca uma constante fixa no código (ver ConciliacaoProperties).
    tolerancia-dias-matching: 2